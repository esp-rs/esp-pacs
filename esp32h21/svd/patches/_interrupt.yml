INTERRUPT_CORE0:
  _strip: INTMTX_CORE0_
  "*":
    _strip: INTMTX_CORE0_

  _array:
    INT_STATUS_REG_*:
      name: CORE_0_INTR_STATUS%s

  _delete:
    _registers:
      - "*_MAP"
    # esp-idf defines this source as an alias of APB_ADC, the generator gives it the next number.
    _interrupts:
      - TEMPERATURE_SENSOR

  _add:
    CORE_0_INTR_MAP%s:
      addressOffset: 0
      dim: 65 # last register is at 0x100
      dimIncrement: 4
      access: read-write
      size: 32
      reset-value: 0
      fields:
        MAP:
          bitOffset: 0
          bitWidth: 5
          access: read-write
