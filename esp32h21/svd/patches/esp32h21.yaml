  - "_mmu_item_index.yml"

_add:
  I2C_ANA_MST:
    description: I2C_ANA_MST Peripheral
    baseAddress: 0x600AD800
    addressBlock:
      - offset: 0x0
        size: 0x38
        usage: "Registers"
    registers:
      I2C0_CTRL:
        description: "I2C0_CTRL register"
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x00
        fields:
          # I2C_MST_I2C0_CTRL : R/W; bitpos: [24:0]; default: 0
          SLAVE_ADDR:
            description: "Configures the slave address"
            bitOffset: 0
            bitWidth: 8
          SLAVE_REG_ADDR:
            description: "Configures the slave register address"
            bitOffset: 8
            bitWidth: 8
          DATA:
            description: "Configures the transmitted data"
            bitOffset: 16
            bitWidth: 8
          READ_WRITE:
            description: "Configures the read/write operation"
            bitOffset: 24
            bitWidth: 1
          # I2C_MST_I2C0_BUSY : RO; bitpos: [25]; default: 0
          BUSY:
            description: "Represents whether I2C0 is currently transferring data"
            bitOffset: 25
            bitWidth: 1
            access: read-only
      I2C1_CTRL:
        description: "I2C1_CTRL register"
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x00
        fields:
          # I2C_MST_I2C1_CTRL : R/W; bitpos: [24:0]; default: 0
          SLAVE_ADDR:
            description: "Configures the slave address"
            bitOffset: 0
            bitWidth: 8
          SLAVE_REG_ADDR:
            description: "Configures the slave register address"
            bitOffset: 8
            bitWidth: 8
          DATA:
            description: "Configures the transmitted data"
            bitOffset: 16
            bitWidth: 8
          READ_WRITE:
            description: "Configures the read/write operation"
            bitOffset: 24
            bitWidth: 1
          # I2C_MST_I2C1_BUSY : RO; bitpos: [25]; default: 0
          BUSY:
            description: "Represents whether I2C1 is currently transferring data"
            bitOffset: 25
            bitWidth: 1
            access: read-only
      I2C0_CONF:
        description: "I2C0_CONF register"
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0x00
        fields:
          # I2C_MST_I2C0_CONF : R/W; bitpos: [23:0]; default: 0
          CONF:
            description: "?"
            bitOffset: 0
            bitWidth: 24
          # I2C_MST_I2C0_STATUS : RO; bitpos: [31:24]; default: 0
          STATUS:
            description: "?"
            bitOffset: 24
            bitWidth: 8
            access: read-only
      I2C1_CONF:
        description: "I2C1_CONF register"
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x00
        fields:
          # I2C_MST_I2C1_CONF : R/W; bitpos: [23:0]; default: 0
          CONF:
            description: "?"
            bitOffset: 0
            bitWidth: 24
          # I2C_MST_I2C1_STATUS : RO; bitpos: [31:24]; default: 0
          STATUS:
            description: "?"
            bitOffset: 24
            bitWidth: 8
            access: read-only
      BURST_CONF:
        description: "BURST_CONF register"
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x00
        fields:
          # I2C_MST_BURST_CTRL : R/W; bitpos: [31:0]; default: 0
          BURST_CTRL:
            description: "?"
            bitOffset: 0
            bitWidth: 32
      BURST_STATUS:
        description: "BURST_STATUS register"
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x00
        fields:
          # I2C_MST_I2C_MST_BURST_DONE : RO; bitpos: [0]; default: 0
          MST_BURST_DONE:
            description: "?"
            bitOffset: 0
            bitWidth: 1
            access: read-only
          # I2C_MST_I2C_MST0_BURST_ERR_FLAG : RO; bitpos: [1]; default: 0
          MST0_BURST_ERR:
            description: "?"
            bitOffset: 1
            bitWidth: 1
            access: read-only
          # I2C_MST_I2C_MST1_BURST_ERR_FLAG : RO; bitpos: [2]; default: 0
          MST1_BURST_ERR:
            description: "?"
            bitOffset: 2
            bitWidth: 1
            access: read-only
          # I2C_MST_BURST_TIMEOUT_CNT : RO; bitpos: [19:3]; default: 0
          TIMEOUT_CNT:
            description: "?"
            bitOffset: 3
            bitWidth: 17
            access: read-only
      ANA_CONF0:
        description: "ANA_CONF0 register"
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0
        fields:
          # I2C_MST_ANA_CONF0 : R/W; bitpos: [23:0]; default: 0
          BBPLL_STOP_FORCE_HIGH:
            description: "?"
            bitOffset: 2
            bitWidth: 1
          BBPLL_STOP_FORCE_LOW:
            description: "?"
            bitOffset: 3
            bitWidth: 1
          # I2C_MST_ANA_STATUS0 : RO; bitpos: [31:24]; default: 0
          CAL_DONE:
            description: "BBPLL calibration done"
            bitOffset: 24
            bitWidth: 1
            access: read-only
      ANA_CONF1:
        description: "ANA_CONF1 register"
        addressOffset: 0x1C
        size: 32
        access: read-write
        resetValue: 0
        fields:
          # I2C_MST_ANA_CONF1 : R/W; bitpos: [23:0]; default: 0
          BIAS_RD:
            description: "Clear to select"
            bitOffset: 6
            bitWidth: 1
          BBPLL_RD:
            description: "Clear to select"
            bitOffset: 7
            bitWidth: 1
          ULP_CAL_RD:
            description: "Clear to select"
            bitOffset: 8
            bitWidth: 1
          SAR_I2C_RD:
            description: "Clear to select"
            bitOffset: 9
            bitWidth: 1
          DIG_REG_RD:
            description: "Clear to select"
            bitOffset: 10
            bitWidth: 1
          BBPLL_PD:
            description: "Clear to enable BBPLL"
            bitOffset: 17
            bitWidth: 1
          SAR_FORCE_PD:
            description: "?"
            bitOffset: 18
            bitWidth: 1
          SAR_FORCE_PU:
            description: "?"
            bitOffset: 16
            bitWidth: 1
          # I2C_MST_ANA_STATUS1 : RO; bitpos: [31:24]; default: 0
          STATUS:
            description: "?"
            bitOffset: 24
            bitWidth: 8
            access: read-only
      ANA_CONF2:
        description: "ANA_CONF2 register"
        addressOffset: 0x20
        size: 32
        access: read-write
        resetValue: 0x00
        fields:
          # I2C_MST_ANA_CONF2 : R/W; bitpos: [23:0]; default: 0
          BIAS_MST_SEL:
            description: "Configures which I2C master the following analog modules uses. If the corresponding bit is set to 1, I2C0 master is used for communication; if set to 0, I2C1 master is used."
            bitOffset: 8
            bitWidth: 1
          BBPLL_MST_SEL:
            description: "Configures which I2C master the following analog modules uses. If the corresponding bit is set to 1, I2C0 master is used for communication; if set to 0, I2C1 master is used."
            bitOffset: 9
            bitWidth: 1
          ULP_CAL_MST_SEL:
            description: "Configures which I2C master the following analog modules uses. If the corresponding bit is set to 1, I2C0 master is used for communication; if set to 0, I2C1 master is used."
            bitOffset: 10
            bitWidth: 1
          SAR_I2C_MST_SEL:
            description: "Configures which I2C master the following analog modules uses. If the corresponding bit is set to 1, I2C0 master is used for communication; if set to 0, I2C1 master is used."
            bitOffset: 11
            bitWidth: 1
          DIG_REG_MST_SEL:
            description: "Configures which I2C master the following analog modules uses. If the corresponding bit is set to 1, I2C0 master is used for communication; if set to 0, I2C1 master is used."
            bitOffset: 12
            bitWidth: 1
          SAR_FORCE_PD:
            description: "?"
            bitOffset: 18
            bitWidth: 1
          BBPLL_M:
            description: "Clear to enable BBPLL"
            bitOffset: 17
            bitWidth: 1
          SAR_FORCE_PU:
            description: "?"
            bitOffset: 16
            bitWidth: 1
          # I2C_MST_ANA_STATUS2 : RO; bitpos: [31:24]; default: 0
          STATUS:
            description: "?"
            bitOffset: 24
            bitWidth: 8
            access: read-only
      I2C0_CTRL1:
        description: "I2C0_CTRL1 register"
        addressOffset: 0x24
        size: 32
        access: read-write
        resetValue: 0x42
        fields:
          # I2C_MST_I2C0_SCL_PULSE_DUR : R/W; bitpos: [5:0]; default: 2
          SCL_PULSE_DUR:
            description: "Configures the duration of the high-level period of the SCL driven by I2C0"
            bitOffset: 0
            bitWidth: 6
          # I2C_MST_I2C0_SDA_SIDE_GUARD : R/W; bitpos: [10:6]; default: 1
          SDA_SIDE_GUARD:
            description: "Configures the duration of the low-level period of the SCL driven by I2C0"
            bitOffset: 6
            bitWidth: 5
      I2C1_CTRL1:
        description: "I2C1_CTRL1 register"
        addressOffset: 0x28
        size: 32
        access: read-write
        resetValue: 0x42
        fields:
          # I2C_MST_I2C1_SCL_PULSE_DUR : R/W; bitpos: [5:0]; default: 2
          SCL_PULSE_DUR:
            description: "Configures the duration of the high-level period of the SCL driven by I2C1"
            bitOffset: 0
            bitWidth: 6
          # I2C_MST_I2C1_SDA_SIDE_GUARD : R/W; bitpos: [10:6]; default: 1
          SDA_SIDE_GUARD:
            description: "Configures the duration of the low-level period of the SCL driven by I2C1"
            bitOffset: 6
            bitWidth: 5
      DATE:
        description: "DATE register"
        addressOffset: 0x34
        size: 32
        access: read-write
        resetValue: 0x02201300
        fields:
          # I2C_MST_DATE : R/W; bitpos: [27:0]; default: 35656448
          DATE:
            description: "Version control register"
            bitOffset: 0
            bitWidth: 28
          # I2C_MST_CLK_EN : R/W; bitpos: [28]; default: 0
          CLK_EN:
            description: "?"
            bitOffset: 28
            bitWidth: 1

_modify:
  SPI?:
    groupName: SPI

APB_SARADC:
  _modify:
    APB_TSENS_WAKE:
      name: TSENS_WAKE
    APB_TSENS_SAMPLE:
      name: TSENS_SAMPLE
  TSENS_SAMPLE:
    _strip: TSENS_SAMPLE_
  _include:
    - ../../../common_patches/int_strip.yaml
    - ../../../common_patches/adc.yaml

I2C0:
  _modify:
    INT_STATUS:
      name: INT_ST
  _include:
    - ../../../common_patches/i2c0.yaml
    - ../../../common_patches/i2c_st_timeouts.yaml

I2C1:
  _include:
    - ../../../common_patches/i2c_st_timeouts.yaml

HP_APM,LP_APM0:
  _include: ../../../common_patches/hp_apm.yaml

# REGION2/3 must be _add'd in the same process as hp_apm clustering.
LP_APM:
  _include:
    - "_lp_apm.yml"
    - ../../../common_patches/hp_apm.yaml

"EFUSE,I2C0,I2S0,UART0,PARL_IO,PAU":
  _include: ../../../common_patches/int_strip.yaml

USB_DEVICE:
  _strip: USB_SERIAL_JTAG_
  _include: ../../../common_patches/int_strip.yaml

LEDC:
  _include:
    - "_ledc_collect.yml"
    - ../../../common_patches/ledc_int.yaml

# ECC interrupt strips are inlined in _ecc.yml (MULT_ prefix).
ECDSA:
  _include: ../../../common_patches/int_strip.yaml

LP_ANA:
  _include: ../../../common_patches/lpana_int_strip.yaml

LP_TIMER:
  INT_RAW:
    _strip_end:
      - _INT_RAW
      - _RAW
  INT_ST:
    _strip_end:
      - _INT_ST
      - _ST
  INT_ENA:
    _strip_end:
      - _INT_ENA
      - _ENA
  INT_CLR:
    _strip_end:
      - _INT_CLR
      - _CLR
    _modify:
      "*":
        modifiedWriteValues: oneToClear

PMU:
  _include: ../../../common_patches/pmu_int_strip.yaml

GPIO_SD:
  _strip: GPIO_EXT_
  _include:
    - ../../../common_patches/gpiosd_ext.yaml
    - ../../../common_patches/int_strip.yaml

UHCI0:
  _include:
    - ../../../common_patches/uhci_collect.yaml
    - ../../../common_patches/int_strip.yaml

TEE:
  _include: ../../../common_patches/tee.yaml

TIMG0:
  _include: ../../../common_patches/tim_collect.yaml

INTPRI:
  CORE0_CPU_INT_PRI_*:
    _modify:
      CORE0_CPU_PRI_*_MAP:
        name: MAP
  _array:
    CORE0_CPU_INT_PRI_*:
      name: CPU_INT_PRI%s
  _include: ../../../common_patches/sw_interrupts.yaml

PCR:
  _include: ../../../common_patches/pcr.yaml

MCPWM0:
  _include: ../../../common_patches/mcpwm_collect.yaml

SOC_ETM:
  _include: "_etm_collect.yml"

SYSTIMER:
  INT_ENA:
    _strip_end: _INT_ENA
  INT_RAW:
    _strip_end: _INT_RAW
  INT_CLR:
    _strip_end: _INT_CLR
  INT_ST:
    _strip_end: _INT_ST
  _include:
    - ../../../common_patches/systimer.yaml
    - ../../../common_patches/systimer_real_target.yaml

DMA:
  _expand_array:
    IN_INT_RAW_CH%s: {}
    IN_INT_ST_CH%s: {}
    IN_INT_ENA_CH%s: {}
    IN_INT_CLR_CH%s: {}

    OUT_INT_RAW_CH%s: {}
    OUT_INT_ST_CH%s: {}
    OUT_INT_ENA_CH%s: {}
    OUT_INT_CLR_CH%s: {}

    IN_CONF0_CH%s: {}
    IN_CONF1_CH%s: {}
    INFIFO_STATUS_CH%s: {}
    IN_POP_CH%s: {}
    IN_LINK_CH%s: {}
    IN_STATE_CH%s: {}
    IN_SUC_EOF_DES_ADDR_CH%s: {}
    IN_ERR_EOF_DES_ADDR_CH%s: {}
    IN_DSCR_CH%s: {}
    IN_DSCR_BF0_CH%s: {}
    IN_DSCR_BF1_CH%s: {}
    IN_PRI_CH%s: {}
    IN_PERI_SEL_CH%s: {}
    OUT_CONF0_CH%s: {}
    OUT_CONF1_CH%s: {}
    OUTFIFO_STATUS_CH%s: {}
    OUT_PUSH_CH%s: {}
    OUT_LINK_CH%s: {}
    OUT_STATE_CH%s: {}
    OUT_EOF_DES_ADDR_CH%s: {}
    OUT_EOF_BFR_DES_ADDR_CH%s: {}
    OUT_DSCR_CH%s: {}
    OUT_DSCR_BF0_CH%s: {}
    OUT_DSCR_BF1_CH%s: {}
    # OUT_PRI_CH0/1/2 stay as individuals (field names fixed in _dma.yml)
    OUT_PERI_SEL_CH%s: {}

  _cluster:
    IN_INT_CH%s:
      IN_INT_RAW_CH?:
        name: RAW
      IN_INT_ST_CH?:
        name: ST
      IN_INT_ENA_CH?:
        name: ENA
      IN_INT_CLR_CH?:
        name: CLR
        _modify:
          "*":
            modifiedWriteValues: oneToClear

    OUT_INT_CH%s:
      OUT_INT_RAW_CH?:
        name: RAW
      OUT_INT_ST_CH?:
        name: ST
      OUT_INT_ENA_CH?:
        name: ENA
      OUT_INT_CLR_CH?:
        name: CLR
        _modify:
          "*":
            modifiedWriteValues: oneToClear

    CH%s:
      IN_CONF0_CH?:
        name: IN_CONF0
      IN_CONF1_CH?:
        name: IN_CONF1
      INFIFO_STATUS_CH?:
        name: INFIFO_STATUS
      IN_POP_CH?:
        name: IN_POP
      IN_LINK_CH?:
        name: IN_LINK
      IN_STATE_CH?:
        name: IN_STATE
      IN_SUC_EOF_DES_ADDR_CH?:
        name: IN_SUC_EOF_DES_ADDR
      IN_ERR_EOF_DES_ADDR_CH?:
        name: IN_ERR_EOF_DES_ADDR
      IN_DSCR_CH?:
        name: IN_DSCR
      IN_DSCR_BF0_CH?:
        name: IN_DSCR_BF0
      IN_DSCR_BF1_CH?:
        name: IN_DSCR_BF1
      IN_PRI_CH?:
        name: IN_PRI
      IN_PERI_SEL_CH?:
        name: IN_PERI_SEL
      OUT_CONF0_CH?:
        name: OUT_CONF0
      OUT_CONF1_CH?:
        name: OUT_CONF1
      OUTFIFO_STATUS_CH?:
        name: OUTFIFO_STATUS
      OUT_PUSH_CH?:
        name: OUT_PUSH
      OUT_LINK_CH?:
        name: OUT_LINK
      OUT_STATE_CH?:
        name: OUT_STATE
      OUT_EOF_DES_ADDR_CH?:
        name: OUT_EOF_DES_ADDR
      OUT_EOF_BFR_DES_ADDR_CH?:
        name: OUT_EOF_BFR_DES_ADDR
      OUT_DSCR_CH?:
        name: OUT_DSCR
      OUT_DSCR_BF0_CH?:
        name: OUT_DSCR_BF0
      OUT_DSCR_BF1_CH?:
        name: OUT_DSCR_BF1
      OUT_PRI_CH?:
        name: OUT_PRI
      OUT_PERI_SEL_CH?:
        name: OUT_PERI_SEL

TWAI0:
  _modify:
    RX_MESSAGE_COUNTER:
      name: RX_MESSAGE_CNT
    INTERRUPT_ENABLE:
      name: INT_ENA
    INTERRUPT:
      name: INT_RAW

  MODE:
    _modify:
      ACCEPTANCE_FILTER_MODE:
        name: RX_FILTER_MODE

  CMD:
    _modify:
      TX_REQUEST:
        name: TX_REQ
      RELEASE_BUFFER:
        name: RELEASE_BUF
      SELF_RX_REQUEST:
        name: SELF_RX_REQ

  STATUS:
    _modify:
      RECEIVE_BUFFER:
        name: RX_BUF_ST
      TRANSMIT_BUFFER:
        name: TX_BUF_ST
      NODE_BUS_OFF:
        name: BUS_OFF_ST
      MISS:
        name: MISS_ST

  BUS_TIMING_1:
    _modify:
      TIME_SEGMENT1:
        name: TIME_SEG1
      TIME_SEGMENT2:
        name: TIME_SEG2
      TIME_SAMPLING:
        name: TIME_SAMP

  DATA*:
    _strip: DATA
    _prefix: TX_BYTE

  ERR_CODE_CAP:
    _modify:
      ERR_CAPTURE_CODE_DIRECTION:
        name: ECC_DIRECTION

  INT_ENA:
    _modify:
      EXT_RECEIVE_INT_ENA:
        name: RX_INT_ENA
      EXT_TRANSMIT_INT_ENA:
        name: TX_INT_ENA
      ARBITRATION_LOST_INT_ENA:
        name: ARB_LOST_INT_ENA

  INT_RAW:
    _modify:
      TRANSMIT_INT_ST:
        name: TX_INT_ST
      RECEIVE_INT_ST:
        name: RX_INT_ST

RSA:
  INT_CLR:
    _modify:
      CLEAR_INTERRUPT:
        name: INT_CLR
        access: read-write

I2C_ANA_MST:
  _array:
    I2C?_CTRL: {}
    I2C?_CTRL1: {}

LP_AON:
  # Make sure the STORE registers are the same type
  STORE0:
    _modify:
      "LP_AON_STORE0":
        name: "DATA"
  _derive:
    STORE[1-9]:
      _from: STORE0
