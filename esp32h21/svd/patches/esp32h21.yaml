_svd: ../esp32h21.base.svd

_include:
  - "_i2c_ana_mst.yml"
  - "_ieee802154.yml"
  - "_modem_lpcon.yml"
  - "_modem_syscon.yml"
  - ../../../common_patches/clint_m_and_u.yaml
  - ../../../common_patches/plic.yaml
  - ../../../common_patches/twai.yaml
  - "_aes.yml"
  - "_assist_debug.yml"
  - "_date.yml"
  - "_dma.yml"
  - "_ds.yml"
  - "_ecc.yml"
  - "_ecdsa.yml"
  - "_gpio.yml"
  - "_hmac.yml"
  - "_i2c.yml"
  - "_interrupt.yml"
  - "_ledc.yml"
  - "_lp_clkrst.yml"
  - "_lp_wdt.yml"
  - "_pcnt.yml"
  - "_pcr.yml"
  - "_pmu.yml"
  - "_rmt.yml"
  - "_rsa.yml"
  - "_sha.yml"
  - "_spi.yml"
  - "_timg.yml"
  - "_uart.yml"
  - "_mmu_item_content.yml"
  - ../../../common_patches/ieee802154.yaml

_modify:
  SPI?:
    groupName: SPI

APB_SARADC:
  _modify:
    APB_TSENS_WAKE:
      name: TSENS_WAKE
    APB_TSENS_SAMPLE:
      name: TSENS_SAMPLE
  TSENS_SAMPLE:
    _strip: TSENS_SAMPLE_
  _include:
    - ../../../common_patches/int_strip.yaml
    - ../../../common_patches/adc.yaml
    - ../../../common_patches/adc_patt_tab.yaml

I2C0:
  _modify:
    INT_STATUS:
      name: INT_ST
  _include:
    - ../../../common_patches/i2c0.yaml
    - ../../../common_patches/i2c_st_timeouts.yaml

I2C1:
  _include:
    - ../../../common_patches/i2c_st_timeouts.yaml

HP_APM,LP_APM0:
  _include: ../../../common_patches/hp_apm.yaml

# REGION2/3 must be _add'd in the same process as hp_apm clustering.
LP_APM:
  _include:
    - "_lp_apm.yml"
    - ../../../common_patches/hp_apm.yaml

"EFUSE,I2C0,I2S0,UART0,PARL_IO,PAU":
  _include: ../../../common_patches/int_strip.yaml

USB_DEVICE:
  _strip: USB_SERIAL_JTAG_
  # The field names carry the peripheral prefix, too.
  "*":
    _strip: USB_SERIAL_JTAG_
  _include: ../../../common_patches/int_strip.yaml

LEDC:
  _include:
    - "_ledc_collect.yml"
    - ../../../common_patches/ledc_int.yaml

# ECC interrupt strips are inlined in _ecc.yml (MULT_ prefix).
ECDSA:
  _include: ../../../common_patches/int_strip.yaml

LP_ANA:
  _include: ../../../common_patches/lpana_int_strip.yaml

LP_TIMER:
  INT_RAW:
    _strip_end:
      - _INT_RAW
      - _RAW
  INT_ST:
    _strip_end:
      - _INT_ST
      - _ST
  INT_ENA:
    _strip_end:
      - _INT_ENA
      - _ENA
  INT_CLR:
    _strip_end:
      - _INT_CLR
      - _CLR
    _modify:
      "*":
        modifiedWriteValues: oneToClear

PMU:
  _include: ../../../common_patches/pmu_int_strip.yaml

GPIO_SD:
  _strip: GPIO_EXT_
  # The field names carry the peripheral prefix, too.
  "*":
    _strip: GPIO_EXT_
  SIGMADELTA_MISC:
    _modify:
      SIGMADELTA_CLK_EN:
        name: FUNCTION_CLK_EN
  _include:
    - ../../../common_patches/gpiosd_ext.yaml
    - ../../../common_patches/int_strip.yaml

UHCI0:
  _include:
    - ../../../common_patches/uhci_collect.yaml
    - ../../../common_patches/int_strip.yaml

TEE:
  _include: ../../../common_patches/tee.yaml

TIMG0:
  _include: ../../../common_patches/tim_collect.yaml

HP_SYS:
  _strip: HP_SYS_
  "*":
    _strip: HP_SYS_

INTPRI:
  _strip: CORE0_
  "*":
    _strip: CORE0_
  CPU_INT_PRI_*:
    _modify:
      CPU_PRI_*_MAP:
        name: MAP
  _array:
    CPU_INT_PRI_*:
      name: CPU_INT_PRI%s
  _include: ../../../common_patches/sw_interrupts.yaml

PCR:
  _include: ../../../common_patches/pcr.yaml

  SARADC_CLKM_CONF:
    SARADC_CLKM_SEL:
      XTAL: [0, "ADC_DIGI_CLK_SRC_XTAL"]
      PLL_F96M: [1, "ADC_DIGI_CLK_SRC_PLL_F96M"]
      RC_FAST: [2, "ADC_DIGI_CLK_SRC_RC_FAST"]

LP_PERI:
  _delete:
    - RNG_DATA
  _modify:
    RNG_DATA_SYNC:
      name: RNG_DATA

IO_MUX:
  _array:
    GPIO*:
      description: IO_MUX Configure Registers for different pads

TRACE:
  MEM_START_ADDR:
    _modify:
      MEM_STAET_ADDR:
        name: MEM_START_ADDR

MCPWM0:
  _include:
    - ../../../common_patches/mcpwm_collect.yaml
    - ../../../common_patches/mcpwm.yaml

SOC_ETM:
  _include: "_etm_collect.yml"

SYSTIMER:
  INT_ENA:
    _strip_end: _INT_ENA
  INT_RAW:
    _strip_end: _INT_RAW
  INT_CLR:
    _strip_end: _INT_CLR
  INT_ST:
    _strip_end: _INT_ST
  _include:
    - ../../../common_patches/systimer.yaml
    - ../../../common_patches/systimer_real_target.yaml

DMA:
  _expand_array:
    IN_INT_RAW_CH%s: {}
    IN_INT_ST_CH%s: {}
    IN_INT_ENA_CH%s: {}
    IN_INT_CLR_CH%s: {}

    OUT_INT_RAW_CH%s: {}
    OUT_INT_ST_CH%s: {}
    OUT_INT_ENA_CH%s: {}
    OUT_INT_CLR_CH%s: {}

    IN_CONF0_CH%s: {}
    IN_CONF1_CH%s: {}
    INFIFO_STATUS_CH%s: {}
    IN_POP_CH%s: {}
    IN_LINK_CH%s: {}
    IN_STATE_CH%s: {}
    IN_SUC_EOF_DES_ADDR_CH%s: {}
    IN_ERR_EOF_DES_ADDR_CH%s: {}
    IN_DSCR_CH%s: {}
    IN_DSCR_BF0_CH%s: {}
    IN_DSCR_BF1_CH%s: {}
    IN_PRI_CH%s: {}
    IN_PERI_SEL_CH%s: {}
    OUT_CONF0_CH%s: {}
    OUT_CONF1_CH%s: {}
    OUTFIFO_STATUS_CH%s: {}
    OUT_PUSH_CH%s: {}
    OUT_LINK_CH%s: {}
    OUT_STATE_CH%s: {}
    OUT_EOF_DES_ADDR_CH%s: {}
    OUT_EOF_BFR_DES_ADDR_CH%s: {}
    OUT_DSCR_CH%s: {}
    OUT_DSCR_BF0_CH%s: {}
    OUT_DSCR_BF1_CH%s: {}
    # OUT_PRI_CH0/1/2 stay as individuals (field names fixed in _dma.yml)
    OUT_PERI_SEL_CH%s: {}

  _cluster:
    IN_INT_CH%s:
      IN_INT_RAW_CH?:
        name: RAW
      IN_INT_ST_CH?:
        name: ST
      IN_INT_ENA_CH?:
        name: ENA
      IN_INT_CLR_CH?:
        name: CLR
        _modify:
          "*":
            modifiedWriteValues: oneToClear

    OUT_INT_CH%s:
      OUT_INT_RAW_CH?:
        name: RAW
      OUT_INT_ST_CH?:
        name: ST
      OUT_INT_ENA_CH?:
        name: ENA
      OUT_INT_CLR_CH?:
        name: CLR
        _modify:
          "*":
            modifiedWriteValues: oneToClear

    CH%s:
      IN_CONF0_CH?:
        name: IN_CONF0
      IN_CONF1_CH?:
        name: IN_CONF1
      INFIFO_STATUS_CH?:
        name: INFIFO_STATUS
      IN_POP_CH?:
        name: IN_POP
      IN_LINK_CH?:
        name: IN_LINK
      IN_STATE_CH?:
        name: IN_STATE
      IN_SUC_EOF_DES_ADDR_CH?:
        name: IN_SUC_EOF_DES_ADDR
      IN_ERR_EOF_DES_ADDR_CH?:
        name: IN_ERR_EOF_DES_ADDR
      IN_DSCR_CH?:
        name: IN_DSCR
      IN_DSCR_BF0_CH?:
        name: IN_DSCR_BF0
      IN_DSCR_BF1_CH?:
        name: IN_DSCR_BF1
      IN_PRI_CH?:
        name: IN_PRI
      IN_PERI_SEL_CH?:
        name: IN_PERI_SEL
      OUT_CONF0_CH?:
        name: OUT_CONF0
      OUT_CONF1_CH?:
        name: OUT_CONF1
      OUTFIFO_STATUS_CH?:
        name: OUTFIFO_STATUS
      OUT_PUSH_CH?:
        name: OUT_PUSH
      OUT_LINK_CH?:
        name: OUT_LINK
      OUT_STATE_CH?:
        name: OUT_STATE
      OUT_EOF_DES_ADDR_CH?:
        name: OUT_EOF_DES_ADDR
      OUT_EOF_BFR_DES_ADDR_CH?:
        name: OUT_EOF_BFR_DES_ADDR
      OUT_DSCR_CH?:
        name: OUT_DSCR
      OUT_DSCR_BF0_CH?:
        name: OUT_DSCR_BF0
      OUT_DSCR_BF1_CH?:
        name: OUT_DSCR_BF1
      OUT_PRI_CH?:
        name: OUT_PRI
      OUT_PERI_SEL_CH?:
        name: OUT_PERI_SEL

TWAI0:
  _modify:
    RX_MESSAGE_COUNTER:
      name: RX_MESSAGE_CNT
    INTERRUPT_ENABLE:
      name: INT_ENA
    INTERRUPT:
      name: INT_RAW

  MODE:
    _modify:
      ACCEPTANCE_FILTER_MODE:
        name: RX_FILTER_MODE

  CMD:
    _modify:
      TX_REQUEST:
        name: TX_REQ
      RELEASE_BUFFER:
        name: RELEASE_BUF
      SELF_RX_REQUEST:
        name: SELF_RX_REQ

  STATUS:
    _modify:
      RECEIVE_BUFFER:
        name: RX_BUF_ST
      TRANSMIT_BUFFER:
        name: TX_BUF_ST
      NODE_BUS_OFF:
        name: BUS_OFF_ST
      ERR:
        name: ERR_ST
      MISS:
        name: MISS_ST

  BUS_TIMING_1:
    _modify:
      TIME_SEGMENT1:
        name: TIME_SEG1
      TIME_SEGMENT2:
        name: TIME_SEG2
      TIME_SAMPLING:
        name: TIME_SAMP

  DATA*:
    _strip: DATA
    _prefix: TX_BYTE

  ERR_CODE_CAP:
    _modify:
      ERR_CAPTURE_CODE_DIRECTION:
        name: ECC_DIRECTION

  INT_ENA:
    _modify:
      EXT_RECEIVE_INT_ENA:
        name: RX_INT_ENA
      EXT_TRANSMIT_INT_ENA:
        name: TX_INT_ENA
      ARBITRATION_LOST_INT_ENA:
        name: ARB_LOST_INT_ENA
      EXT_ERR_WARNING_INT_ENA:
        name: ERR_WARN_INT_ENA
      EXT_DATA_OVERRUN_INT_ENA:
        name: OVERRUN_INT_ENA

  INT_RAW:
    _modify:
      TRANSMIT_INT_ST:
        name: TX_INT_ST
      RECEIVE_INT_ST:
        name: RX_INT_ST
      ERR_WARNING_INT_ST:
        name: ERR_WARN_INT_ST
      DATA_OVERRUN_INT_ST:
        name: OVERRUN_INT_ST
      ARBITRATION_LOST_INT_ST:
        name: ARB_LOST_INT_ST

RSA:
  INT_CLR:
    _modify:
      CLEAR_INTERRUPT:
        name: INT_CLR
        access: read-write

I2C_ANA_MST:
  _array:
    I2C?_CTRL: {}
    I2C?_CTRL1: {}

LP_AON:
  # Make sure the STORE registers are the same type
  STORE0:
    _modify:
      "LP_AON_STORE0":
        name: "DATA"
  _derive:
    STORE[1-9]:
      _from: STORE0
