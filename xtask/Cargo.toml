[package]
name    = "xtask"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow     = "1.0.99"
clap       = { version = "4.5.45", features = ["derive"] }
csv        = "1.3.1"
env_logger = "0.11.8"
form       = "0.13.0"
log        = "0.4.27"
rayon      = "1.11.0"
regex      = "1.11.1"
semver     = "1.0.26"
serde      = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
strum      = { version = "0.27.2", features = ["derive"] }
svd2rust   = { git = "https://github.com/MabezDev/svd2rust", branch = "skip-peripherals-struct-0.37.1", features = ["serde", "yaml"], default-features = false }
svdtools   = "0.5.0"
toml_edit  = "0.23.3"
