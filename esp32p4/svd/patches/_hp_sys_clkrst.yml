HP_SYS_CLKRST:
  "*":
    _strip: "REG_"

  ROOT_CLK_CTRL0:
    _modify:
      SOC_CLK_DIV_UPDATE:
        access: read-write

  PERI_CLK_CTRL22:
    ADC_CLK_SRC_SEL:
      XTAL: [0, "ADC_DIGI_CLK_SRC_XTAL"]
      RC_FAST: [1, "ADC_DIGI_CLK_SRC_RC_FAST"]
      PLL_F80M: [2, "ADC_DIGI_CLK_SRC_PLL_F80M"]

  SOC_CLK_CTRL1:
    _modify:
      BITSRAMBLER_SYS_CLK_EN:
        name: BITSCRAMBLER_SYS_CLK_EN
      BITSRAMBLER_RX_SYS_CLK_EN:
        name: BITSCRAMBLER_RX_SYS_CLK_EN
      BITSRAMBLER_TX_SYS_CLK_EN:
        name: BITSCRAMBLER_TX_SYS_CLK_EN

  HP_RST_EN2:
    _modify:
      RST_EN_BITSRAMBLER:
        name: RST_EN_BITSCRAMBLER
      RST_EN_BITSRAMBLER_RX:
        name: RST_EN_BITSCRAMBLER_RX
      RST_EN_BITSRAMBLER_TX:
        name: RST_EN_BITSCRAMBLER_TX

  HP_FORCE_NORST1:
    _modify:
      FORCE_NORST_BITSRAMBLER:
        name: FORCE_NORST_BITSCRAMBLER
      FORCE_NORST_BITSRAMBLER_RX:
        name: FORCE_NORST_BITSCRAMBLER_RX
      FORCE_NORST_BITSRAMBLER_TX:
        name: FORCE_NORST_BITSCRAMBLER_TX
