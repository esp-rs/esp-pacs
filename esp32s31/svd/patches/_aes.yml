AES:
  _modify:
    "IV_MEM*":
      dim: 4
      dimIncrement: 0x4
      size: 0x20
    "H_MEM*":
      dim: 4
      dimIncrement: 0x4
      size: 0x20
    "J0_MEM*":
      dim: 4
      dimIncrement: 0x4
      size: 0x20
    "T0_MEM*":
      dim: 4
      dimIncrement: 0x4
      size: 0x20

    KEY_%s:
      name: "KEY[%s]"
    TEXT_IN_%s:
      name: "TEXT_IN[%s]"
    TEXT_OUT_%s:
      name: "TEXT_OUT[%s]"

    INT_CLEAR:
      name: INT_CLR

  "KEY*":
    _modify:
      KEY_0:
        name: KEY
    KEY: [0, 0xffff_ffff]
  "TEXT_IN*":
    _modify:
      TEXT_IN_0:
        name: TEXT_IN
    TEXT_IN: [0, 0xffff_ffff]
  "TEXT_OUT*":
    _modify:
      TEXT_OUT_0:
        name: TEXT_OUT
  INT_CLR:
    _modify:
      INT_CLEAR:
        name: INT_CLR
