# Split DMA out of the Synopsys GMAC block and drop EMAC/GMAC register prefixes.

GMAC:
  _delete:
    - REGISTER2_HASHTABLEHIGHREGISTER
    - REGISTER3_HASHTABLELOWREGISTER
    - REGISTER7_VLANTAGREGISTER
    - REGISTER8_VERSIONREGISTER
    - REGISTER48_ANCONTROLREGISTER
    - REGISTER49_ANSTATUSREGISTER
    - REGISTER50_AUTONEGOTIATIONADVERTISEMENTREGISTER
    - REGISTER51_AUTONEGOTIATIONLINKPARTNERABILITYREGISTER
    - REGISTER52_AUTONEGOTIATIONEXPANSIONREGISTER
    - REGISTER53_TBIEXTENDEDSTATUSREGISTER
    - REGISTER56_GENERALPURPOSEIOREGISTER
    - REGISTER256_LAYER3ANDLAYER4CONTROLREGISTER0
    - REGISTER257_LAYER4ADDRESSREGISTER0
    - REGISTER260_LAYER3ADDRESS0REGISTER0
    - REGISTER261_LAYER3ADDRESS1REGISTER0
    - REGISTER262_LAYER3ADDRESS2REGISTER0
    - REGISTER263_LAYER3ADDRESS3REGISTER0
    - REGISTER320_HASHTABLEREGISTER0
    - REGISTER353_VLANTAGINCLUSIONORREPLACEMENTREGISTER
    - REGISTER354_VLANHASHTABLEREGISTER
    - REGISTER448_TIMESTAMPCONTROLREGISTER
    - REGISTER449_SUBSECONDINCREMENTREGISTER
    - REGISTER450_SYSTEMTIMESECONDSREGISTER
    - REGISTER451_SYSTEMTIMENANOSECONDSREGISTER
    - REGISTER452_SYSTEMTIMESECONDSUPDATEREGISTER
    - REGISTER453_SYSTEMTIMENANOSECONDSUPDATEREGISTER
    - REGISTER454_TIMESTAMPADDENDREGISTER
    - REGISTER455_TARGETTIMESECONDSREGISTER
    - REGISTER456_TARGETTIMENANOSECONDSREGISTER
    - REGISTER457_SYSTEMTIMEHIGHERWORDSECONDSREGISTER
    - REGISTER458_TIMESTAMPSTATUSREGISTER
    - REGISTER459_PPSCONTROLREGISTER
    - REGISTER460_AUXILIARYTIMESTAMPNANOSECONDSREGISTER
    - REGISTER461_AUXILIARYTIMESTAMPSECONDSREGISTER
    - REGISTER462_AVMACCONTROLREGISTER
    - REGISTER472_PPS0INTERVALREGISTER
    - REGISTER473_PPS0WIDTHREGISTER
    - REGISTER480_PPS1TARGETTIMESECONDSREGISTER
    - REGISTER481_PPS1TARGETTIMENANOSECONDSREGISTER
    - REGISTER544_MACADDRESS32HIGHREGISTER
    - REGISTER0_BUSMODEREGISTER
    - REGISTER1_TRANSMITPOLLDEMANDREGISTER
    - REGISTER2_RECEIVEPOLLDEMANDREGISTER
    - REGISTER3_RECEIVEDESCRIPTORLISTADDRESSREGISTER
    - REGISTER4_TRANSMITDESCRIPTORLISTADDRESSREGISTER
    - REGISTER5_STATUSREGISTER
    - REGISTER6_OPERATIONMODEREGISTER
    - REGISTER7_INTERRUPTENABLEREGISTER
    - REGISTER8_MISSEDFRAMEANDBUFFEROVERFLOWCOUNTERREGISTER
    - REGISTER9_RECEIVEINTERRUPTWATCHDOGTIMERREGISTER
    - REGISTER10_AXIBUSMODEREGISTER
    - REGISTER11_AHBORAXISTATUSREGISTER
    - REGISTER18_CURRENTHOSTTRANSMITDESCRIPTORREGISTER
    - REGISTER19_CURRENTHOSTRECEIVEDESCRIPTORREGISTER
    - REGISTER20_CURRENTHOSTTRANSMITBUFFERADDRESSREGISTER
    - REGISTER21_CURRENTHOSTRECEIVEBUFFERADDRESSREGISTER
    - REGISTER22_HWFEATUREREGISTER
    - "*CHANNEL*"

  _modify:
    REGISTER0_MACCONFIGURATIONREGISTER:
      name: CONFIG
      description: MAC configuration
    REGISTER1_MACFRAMEFILTER:
      name: FF
      description: Frame filter settings
    REGISTER4_GMIIADDRESSREGISTER:
      name: GMIIADDR
      description: PHY configuration access
    REGISTER5_GMIIDATAREGISTER:
      name: MIIDATA
      description: PHY data read write
    REGISTER6_FLOWCONTROLREGISTER:
      name: FC
      description: Frame flow control
    REGISTER9_DEBUGREGISTER:
      name: DEBUG
      description: Status debugging bits
      access: read-only
    REGISTER10_REMOTEWAKEUPFRAMEFILTERREGISTER:
      name: PMT_RWUFFR
      access: read-only
    REGISTER11_PMTCONTROLANDSTATUSREGISTER:
      name: PMT_CSR
      description: PMT Control and Status
      access: read-only
    REGISTER12_LPICONTROLANDSTATUSREGISTER:
      name: LPI_CRS
      description: LPI Control and Status
      access: read-only
    REGISTER13_LPITIMERSCONTROLREGISTER:
      name: LPITIMERSCONTROL
      description: LPI Timers Control
      access: read-only
    REGISTER14_INTERRUPTSTATUSREGISTER:
      name: INTS
      description: Interrupt status
      access: read-only
    REGISTER15_INTERRUPTMASKREGISTER:
      name: INTMASK
      description: Interrupt mask
    REGISTER16_MACADDRESS0HIGHREGISTER:
      name: ADDR0HIGH
      description: Upper 16 bits of the first 6-byte MAC address
    REGISTER17_MACADDRESS0LOWREGISTER:
      name: ADDR0LOW
    REGISTER18_MACADDRESS1HIGHREGISTER:
      name: ADDR1HIGH
      description: Upper 16 bits of the second 6-byte MAC address
    REGISTER19_MACADDRESS1LOWREGISTER:
      name: ADDR1LOW
    MACADDRESS2HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHETHIRDMACADDRESS:
      name: ADDR2HIGH
      description: Upper 16 bits of the third 6-byte MAC address
    MACADDRESS2LOWREGISTERCONTAINSTHELOWER32BITSOFTHETHIRDMACADDRESS:
      name: ADDR2LOW
    MACADDRESS3HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHEFOURTHMACADDRESS:
      name: ADDR3HIGH
      description: Upper 16 bits of the fourth 6-byte MAC address
    MACADDRESS3LOWREGISTERCONTAINSTHELOWER32BITSOFTHEFOURTHMACADDRESS:
      name: ADDR3LOW
    MACADDRESS4HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHEFIFTHMACADDRESS:
      name: ADDR4HIGH
      description: Upper 16 bits of the fifth 6-byte MAC address
    MACADDRESS4LOWREGISTERCONTAINSTHELOWER32BITSOFTHEFIFTHMACADDRESS:
      name: ADDR4LOW
    MACADDRESS5HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHESIXTHMACADDRESS:
      name: ADDR5HIGH
      description: Upper 16 bits of the sixth 6-byte MAC address
    MACADDRESS5LOWREGISTERCONTAINSTHELOWER32BITSOFTHESIXTHMACADDRESS:
      name: ADDR5LOW
    MACADDRESS6HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHESEVENTHMACADDRESS:
      name: ADDR6HIGH
      description: Upper 16 bits of the seventh 6-byte MAC address
    MACADDRESS6LOWREGISTERCONTAINSTHELOWER32BITSOFTHESEVENTHMACADDRESS:
      name: ADDR6LOW
    MACADDRESS7HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHEEIGHTHMACADDRESS:
      name: ADDR7HIGH
      description: Upper 16 bits of the eighth 6-byte MAC address
    MACADDRESS7LOWREGISTERCONTAINSTHELOWER32BITSOFTHEEIGHTHMACADDRESS:
      name: ADDR7LOW
    REGISTER54_SGMII_RGMII_SMIICONTROLANDSTATUSREGISTER:
      name: CSTATUS
      description: Link communication status
      access: read-only
    REGISTER55_WATCHDOGTIMEOUTREGISTER:
      name: WDOGTO
      description: Watchdog timeout control

  CONFIG:
    _modify:
      PRELEN:
        name: PLTF
      RE:
        name: RX
      TE:
        name: TX
      DC:
        name: DEFERRALCHECK
      BL:
        name: BACKOFFLIMIT
      ACS:
        name: PADCRCSTRIP
      DR:
        name: RETRY
      IPC:
        name: RXIPCOFFLOAD
      DM:
        name: DUPLEX
      LM:
        name: LOOPBACK
      DO:
        name: RXOWN
      FES:
        name: FESPEED
      PS:
        name: MII
      DCRS:
        name: DISABLECRS
      IFG:
        name: INTERFRAMEGAP
      JE:
        name: JUMBOFRAME
      JD:
        name: JABBER
      WD:
        name: WATCHDOG

  FF:
    _modify:
      PROMISCUOUS_MODE:
        name: PMODE
      PM:
        name: PAM
      SAF:
        name: SAFE
      RA:
        name: RECEIVE_ALL

  GMIIADDR:
    _modify:
      GB:
        name: MIIBUSY
      GW:
        name: MIIWRITE
      CR:
        name: MIICSRCLK
      GR:
        name: MIIREG
      PA:
        name: MIIDEV

  MIIDATA:
    _modify:
      GD:
        name: MII_DATA

  INTMASK:
    _modify:
      PMTIM:
        name: PMTINTMASK
      LPIIM:
        name: LPIINTMASK

  ADDR0HIGH:
    _modify:
      ADDRHI_0:
        name: ADDRESS0_HI
      AE_0:
        name: ADDRESS_ENABLE0
        access: read-write

  ADDR0LOW:
    _delete: ADDRLO_0

GMAC_DMA:
  _delete:
    - REGISTER0_MACCONFIGURATIONREGISTER
    - REGISTER1_MACFRAMEFILTER
    - REGISTER2_HASHTABLEHIGHREGISTER
    - REGISTER3_HASHTABLELOWREGISTER
    - REGISTER4_GMIIADDRESSREGISTER
    - REGISTER5_GMIIDATAREGISTER
    - REGISTER6_FLOWCONTROLREGISTER
    - REGISTER7_VLANTAGREGISTER
    - REGISTER8_VERSIONREGISTER
    - REGISTER9_DEBUGREGISTER
    - REGISTER10_REMOTEWAKEUPFRAMEFILTERREGISTER
    - REGISTER11_PMTCONTROLANDSTATUSREGISTER
    - REGISTER12_LPICONTROLANDSTATUSREGISTER
    - REGISTER13_LPITIMERSCONTROLREGISTER
    - REGISTER14_INTERRUPTSTATUSREGISTER
    - REGISTER15_INTERRUPTMASKREGISTER
    - REGISTER16_MACADDRESS0HIGHREGISTER
    - REGISTER17_MACADDRESS0LOWREGISTER
    - REGISTER18_MACADDRESS1HIGHREGISTER
    - REGISTER19_MACADDRESS1LOWREGISTER
    - MACADDRESS2HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHETHIRDMACADDRESS
    - MACADDRESS2LOWREGISTERCONTAINSTHELOWER32BITSOFTHETHIRDMACADDRESS
    - MACADDRESS3HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHEFOURTHMACADDRESS
    - MACADDRESS3LOWREGISTERCONTAINSTHELOWER32BITSOFTHEFOURTHMACADDRESS
    - MACADDRESS4HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHEFIFTHMACADDRESS
    - MACADDRESS4LOWREGISTERCONTAINSTHELOWER32BITSOFTHEFIFTHMACADDRESS
    - MACADDRESS5HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHESIXTHMACADDRESS
    - MACADDRESS5LOWREGISTERCONTAINSTHELOWER32BITSOFTHESIXTHMACADDRESS
    - MACADDRESS6HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHESEVENTHMACADDRESS
    - MACADDRESS6LOWREGISTERCONTAINSTHELOWER32BITSOFTHESEVENTHMACADDRESS
    - MACADDRESS7HIGHREGISTERCONTAINSTHEHIGHER16BITSOFTHEEIGHTHMACADDRESS
    - MACADDRESS7LOWREGISTERCONTAINSTHELOWER32BITSOFTHEEIGHTHMACADDRESS
    - REGISTER48_ANCONTROLREGISTER
    - REGISTER49_ANSTATUSREGISTER
    - REGISTER50_AUTONEGOTIATIONADVERTISEMENTREGISTER
    - REGISTER51_AUTONEGOTIATIONLINKPARTNERABILITYREGISTER
    - REGISTER52_AUTONEGOTIATIONEXPANSIONREGISTER
    - REGISTER53_TBIEXTENDEDSTATUSREGISTER
    - REGISTER54_SGMII_RGMII_SMIICONTROLANDSTATUSREGISTER
    - REGISTER55_WATCHDOGTIMEOUTREGISTER
    - REGISTER56_GENERALPURPOSEIOREGISTER
    - REGISTER256_LAYER3ANDLAYER4CONTROLREGISTER0
    - REGISTER257_LAYER4ADDRESSREGISTER0
    - REGISTER260_LAYER3ADDRESS0REGISTER0
    - REGISTER261_LAYER3ADDRESS1REGISTER0
    - REGISTER262_LAYER3ADDRESS2REGISTER0
    - REGISTER263_LAYER3ADDRESS3REGISTER0
    - REGISTER320_HASHTABLEREGISTER0
    - REGISTER353_VLANTAGINCLUSIONORREPLACEMENTREGISTER
    - REGISTER354_VLANHASHTABLEREGISTER
    - REGISTER448_TIMESTAMPCONTROLREGISTER
    - REGISTER449_SUBSECONDINCREMENTREGISTER
    - REGISTER450_SYSTEMTIMESECONDSREGISTER
    - REGISTER451_SYSTEMTIMENANOSECONDSREGISTER
    - REGISTER452_SYSTEMTIMESECONDSUPDATEREGISTER
    - REGISTER453_SYSTEMTIMENANOSECONDSUPDATEREGISTER
    - REGISTER454_TIMESTAMPADDENDREGISTER
    - REGISTER455_TARGETTIMESECONDSREGISTER
    - REGISTER456_TARGETTIMENANOSECONDSREGISTER
    - REGISTER457_SYSTEMTIMEHIGHERWORDSECONDSREGISTER
    - REGISTER458_TIMESTAMPSTATUSREGISTER
    - REGISTER459_PPSCONTROLREGISTER
    - REGISTER460_AUXILIARYTIMESTAMPNANOSECONDSREGISTER
    - REGISTER461_AUXILIARYTIMESTAMPSECONDSREGISTER
    - REGISTER462_AVMACCONTROLREGISTER
    - REGISTER472_PPS0INTERVALREGISTER
    - REGISTER473_PPS0WIDTHREGISTER
    - REGISTER480_PPS1TARGETTIMESECONDSREGISTER
    - REGISTER481_PPS1TARGETTIMENANOSECONDSREGISTER
    - REGISTER544_MACADDRESS32HIGHREGISTER
    - REGISTER10_AXIBUSMODEREGISTER
    - REGISTER11_AHBORAXISTATUSREGISTER
    - REGISTER22_HWFEATUREREGISTER
    - "*CHANNEL*"

  _modify:
    REGISTER0_BUSMODEREGISTER:
      name: DMABUSMODE
      description: Bus mode configuration
      addressOffset: 0x0
    REGISTER1_TRANSMITPOLLDEMANDREGISTER:
      name: DMATXPOLLDEMAND
      addressOffset: 0x4
      access: read-only
    REGISTER2_RECEIVEPOLLDEMANDREGISTER:
      name: DMARXPOLLDEMAND
      addressOffset: 0x8
      access: read-only
    REGISTER3_RECEIVEDESCRIPTORLISTADDRESSREGISTER:
      name: DMARXBASEADDR
      addressOffset: 0xc
    REGISTER4_TRANSMITDESCRIPTORLISTADDRESSREGISTER:
      name: DMATXBASEADDR
      addressOffset: 0x10
    REGISTER5_STATUSREGISTER:
      name: DMASTATUS
      description: State of interrupts, errors and other events
      addressOffset: 0x14
    REGISTER6_OPERATIONMODEREGISTER:
      name: DMAOPERATION_MODE
      description: Receive and Transmit operating modes and command
      addressOffset: 0x18
    REGISTER7_INTERRUPTENABLEREGISTER:
      name: DMAIN_EN
      description: Enable / disable interrupts
      addressOffset: 0x1c
    REGISTER8_MISSEDFRAMEANDBUFFEROVERFLOWCOUNTERREGISTER:
      name: DMAMISSEDFR
      description: Missed Frame and Buffer Overflow Counter Register
      addressOffset: 0x20
    REGISTER9_RECEIVEINTERRUPTWATCHDOGTIMERREGISTER:
      name: DMARINTWDTIMER
      description: Watchdog timer count on receive
      addressOffset: 0x24
    REGISTER18_CURRENTHOSTTRANSMITDESCRIPTORREGISTER:
      name: DMATXCURRDESC
      addressOffset: 0x48
      access: read-only
    REGISTER19_CURRENTHOSTRECEIVEDESCRIPTORREGISTER:
      name: DMARXCURRDESC
      addressOffset: 0x4c
      access: read-only
    REGISTER20_CURRENTHOSTTRANSMITBUFFERADDRESSREGISTER:
      name: DMATXCURRADDR_BUF
      addressOffset: 0x50
      access: read-only
    REGISTER21_CURRENTHOSTRECEIVEBUFFERADDRESSREGISTER:
      name: DMARXCURRADDR_BUF
      addressOffset: 0x54
      access: read-only

  DMABUSMODE:
    _modify:
      SWR:
        name: SW_RST
      DA:
        name: DMA_ARB_SCH
      DSL:
        name: DESC_SKIP_LEN
      ATDS:
        name: ALT_DESC_SIZE
      PBL:
        name: PROG_BURST_LEN
      PR:
        name: PRI_RATIO
      FB:
        name: FIXED_BURST
      RPBL:
        name: RX_DMA_PBL
      USP:
        name: USE_SEP_PBL
      PBLX8:
        name: PBLX8_MODE
      AAL:
        name: DMAADDRALIBEA
      MB:
        name: DMAMIXEDBURST

  DMAOPERATION_MODE:
    _modify:
      SR:
        name: START_STOP_RX
      OSF:
        name: OPT_SECOND_FRAME
      RTC:
        name: RX_THRESH_CTRL
      DGF:
        name: DROP_GFRM
      FUF:
        name: FWD_UNDER_GF
      FEF:
        name: FWD_ERR_FRAME
      ST:
        name: START_STOP_TRANSMISSION_COMMAND
      TTC:
        name: TX_THRESH_CTRL
      FTF:
        name: FLUSH_TX_FIFO
      TSF:
        name: TX_STR_FWD
      DFF:
        name: DIS_FLUSH_RECV_FRAMES
      RSF:
        name: RX_STORE_FORWARD
      DT:
        name: DIS_DROP_TCPIP_ERR_FRAM

  DMAIN_EN:
    _modify:
      TIE:
        name: DMAIN_TIE
      TSE:
        name: DMAIN_TSE
      TUE:
        name: DMAIN_TBUE
      TJE:
        name: DMAIN_TJTE
      OVE:
        name: DMAIN_OIE
      UNE:
        name: DMAIN_UIE
      RIE:
        name: DMAIN_RIE
      RUE:
        name: DMAIN_RBUE
      RSE:
        name: DMAIN_RSE
      RWE:
        name: DMAIN_RWTE
      ETE:
        name: DMAIN_ETIE
      FBE:
        name: DMAIN_FBEE
      ERE:
        name: DMAIN_ERIE
      AIE:
        name: DMAIN_AISE
      NIE:
        name: DMAIN_NISE

  DMATXPOLLDEMAND:
    _delete: TPD
  DMARXPOLLDEMAND:
    _delete: RPD
  DMARXBASEADDR:
    _delete: RDESLA
  DMATXBASEADDR:
    _delete: TDESLA
