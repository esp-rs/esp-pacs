RMT:
  _expand_array:
    CH%sDATA: {}
    CH%sCONF0: {}
    CH%sCONF1: {}
    CH%sSTATUS: {}

  _array:
    "CH?DATA":
      name: CH%sDATA
      description: The read and write data register for CHANNEL%s by apb fifo access.
    "CH[0123]CONF0":
      name: CH%s_TX_CONF0
    "CH[4567]CONF0":
      name: CH%s_RX_CONF0
    "CH[4567]CONF1":
      name: CH%s_RX_CONF1
    "CH[0123]STATUS":
      name: CH%s_TX_STATUS
    "CH[4567]STATUS":
      name: CH%s_RX_STATUS

  "*":
    _strip_end: "_CH"

  "CH%sDATA":
    _modify:
      CHDATA:
        name: DATA
        access: read-write

  "CH*CONF0":
    _strip_end:
      - "_CH0"
      - "_CH4"
  "CH*CONF1":
    _strip_end: "_CH4"

  "CH*STATUS":
    _strip_end:
      - "_CH0"
      - "_CH4"

  INT_RAW:
    _strip_end: "_INT_RAW"
    _array:
      "CH?_TX_END": {}
      "CH[0123]_ERR":
        name: CH%s_TX_ERR
      "CH?_TX_THR_EVENT": {}
      "CH?_TX_LOOP": {}
      "CH?_RX_END": {}
      "CH[4567]_ERR":
        name: CH%s_RX_ERR
      "CH?_RX_THR_EVENT": {}

  INT_ST:
    _strip_end: "_INT_ST"
    _array:
      "CH?_TX_END": {}
      "CH[0123]_ERR":
        name: CH%s_TX_ERR
      "CH?_TX_THR_EVENT": {}
      "CH?_TX_LOOP": {}
      "CH?_RX_END": {}
      "CH[4567]_ERR":
        name: CH%s_RX_ERR
      "CH?_RX_THR_EVENT": {}

  INT_ENA:
    _strip_end: "_INT_ENA"
    _array:
      "CH?_TX_END": {}
      "CH[0123]_ERR":
        name: CH%s_TX_ERR
      "CH?_TX_THR_EVENT": {}
      "CH?_TX_LOOP": {}
      "CH?_RX_END": {}
      "CH[4567]_ERR":
        name: CH%s_RX_ERR
      "CH?_RX_THR_EVENT": {}

  INT_CLR:
    _strip_end: "_INT_CLR"
    _array:
      "CH?_TX_END": {}
      "CH[0123]_ERR":
        name: CH%s_TX_ERR
      "CH?_TX_THR_EVENT": {}
      "CH?_TX_LOOP": {}
      "CH?_RX_END": {}
      "CH[4567]_ERR":
        name: CH%s_RX_ERR
      "CH?_RX_THR_EVENT": {}

  REF_CNT_RST:
    _array:
      "CH?": {}
