_svd: ../esp32h4.base.svd
_include:
  - ../../../common_patches/clint.yaml
  - "_clic.yml"
  - "_aes.yml"
  - "_date.yml"
  - "_dma.yml"
  - "_ecc.yml"
  - "_ecdsa.yml"
  - "_gpio.yml"
  - "_hmac.yml"
  - "_interrupt.yml"
  - "_ledc.yml"
  - "_lp_wdt.yml"
  - "_pcnt.yml"
  - "_pcr.yml"
  - "_pmu.yml"
  - "_rmt.yml"
  - "_sha.yml"
  - "_spi.yml"
  - "_uart.yml"
  - "_mmu_item_content.yml"
  - "_mmu_item_index.yml"

TIMG0:
  _include: "_timg.yml"

MCPWM0:
  _expand_array:
    TIMER%s_CFG0: {}
    TIMER%s_CFG1: {}
    TIMER%s_SYNC: {}
    TIMER%s_STATUS: {}
    GEN%s_STMP_CFG: {}
    GEN%s_TSTMP_A: {}
    GEN%s_TSTMP_B: {}
    GEN%s_CFG0: {}
    GEN%s_FORCE: {}
    GEN%s_A: {}
    GEN%s_B: {}
    DT%s_CFG: {}
    DT%s_FED_CFG: {}
    DT%s_RED_CFG: {}
    CARRIER%s_CFG: {}
    FH%s_CFG0: {}
    FH%s_CFG1: {}
    FH%s_STATUS: {}
    CAP_CH%s_CFG: {}
    CAP_CH%s: {}
    OP%s_TSTMP_E1: {}
    OP%s_TSTMP_E2: {}
  
  _include:
    - ../../../common_patches/mcpwm_collect.yaml
    - ../../../common_patches/mcpwm.yaml

SOC_ETM:
  _include: "_etm_collect.yml"

SYSTIMER:
  _include:
    - ../../../common_patches/int_strip.yaml
    - ../../../common_patches/systimer.yaml
    - ../../../common_patches/systimer_real_target.yaml

UHCI0:
  _include: ../../../common_patches/uhci_collect.yaml

I2C0:
  _modify:
    INT_STATUS:
      name: INT_ST
  DATA:
    _modify:
      FIFO_RDATA:
        access: read-write
  _include:
    - ../../../common_patches/i2c_force_out.yaml
    - ../../../common_patches/int_strip.yaml

"EFUSE,I2S0,UART0,PARL_IO,PAU":
  _include: ../../../common_patches/int_strip.yaml

GPIO_SD:
  _strip: GPIO_EXT_
  SIGMADELTA%s:
    _strip: ["SD0_", "SD_"]
  GLITCH_FILTER_CH%s:
    _strip: FILTER_CH0_
  ETM_EVENT_CH%s_CFG:
    _strip: ETM_CH0_
  ETM_TASK_P*_CFG:
    _strip: ETM_TASK_
    _array:
      GPIO*_EN:
        description: Enable GPIO%s for ETM task
      GPIO*_SEL:
        description: Select GPIO%s for ETM task

USB_DEVICE:
  _strip: USB_SERIAL_JTAG_
  _include: ../../../common_patches/int_strip.yaml

LEDC:
  _include:
    - ../../../common_patches/ledc_collect.yaml
    - ../../../common_patches/ledc_int.yaml

ECDSA:
  _include: ../../../common_patches/int_strip.yaml

LP_ANA:
  _include: ../../../common_patches/lpana_int_strip.yaml

LP_TIMER:
  _include: ../../../common_patches/lptim_int_strip.yaml

PMU:
  _include: ../../../common_patches/pmu_int_strip.yaml

RNG:
  _modify:
    DATA:
      access: read-only

_modify:
  MCPWM0:
    groupName: MCPWM
    description: Motor Control Pulse Width Modulator (MCPWM) Peripheral

_add:
  INTERRUPT_CORE1:
    derivedFrom: INTERRUPT_CORE0
    baseAddress: 0x6009B000
