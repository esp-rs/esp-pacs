DMA:
  # Channel 0 is described separately from the CH1..CH4 array, turn it back into one array.
  _delete: OUT_CONF0_CH0

  _modify:
    "OUT_CONF0_CH%s":
      dim: 5
      dimIndex: "0,1,2,3,4"
      addressOffset: 0x180
      dimIncrement: 0x100

  # The interrupt registers of channel 0 are not part of an array either, so their fields carry
  # the channel number as well.
  "IN_INT_RAW_CH*":
    _strip_end:
      - "_CH_INT_RAW"
      - "_CH?_INT_RAW"
  "IN_DONE_DES_ADDR_CH*":
    _strip_end:
      - "_CH"
      - "_CH?"
  "IN_INT_ST_CH%s":
    _strip_end: "_CH_INT_ST"
  "IN_INT_ENA_CH%s":
    _strip_end: "_CH_INT_ENA"
  "IN_INT_CLR_CH%s":
    _strip_end: "_CH_INT_CLR"
  "OUT_INT_RAW_CH%s":
    _strip_end: "_CH_INT_RAW"
  "OUT_INT_ST_CH%s":
    _strip_end: "_CH_INT_ST"
  "OUT_INT_ENA_CH%s":
    _strip_end: "_CH_INT_ENA"
  "OUT_INT_CLR_CH%s":
    _strip_end: "_CH_INT_CLR"

  "IN_CONF0_CH%s,IN_CONF1_CH%s,INFIFO_STATUS_CH%s,IN_POP_CH%s,IN_LINK_CH%s,IN_LINK_ADDR_CH%s,IN_STATE_CH%s,IN_SUC_EOF_DES_ADDR_CH%s,IN_ERR_EOF_DES_ADDR_CH%s,IN_DSCR_CH%s,IN_DSCR_BF0_CH%s,IN_DSCR_BF1_CH%s,IN_PRI_CH%s,IN_PERI_SEL_CH%s,RX_CH_ARB_WEIGH_CH%s,RX_ARB_WEIGH_OPT_DIR_CH%s,OUT_CONF0_CH%s,OUT_CONF1_CH%s,OUTFIFO_STATUS_CH%s,OUT_PUSH_CH%s,OUT_LINK_CH%s,OUT_LINK_ADDR_CH%s,OUT_STATE_CH%s,OUT_EOF_DES_ADDR_CH%s,OUT_EOF_BFR_DES_ADDR_CH%s,OUT_DONE_DES_ADDR_CH%s,OUT_DSCR_CH%s,OUT_DSCR_BF0_CH%s,OUT_DSCR_BF1_CH%s,OUT_PRI_CH%s,OUT_PERI_SEL_CH%s,TX_CH_ARB_WEIGH_CH%s,TX_ARB_WEIGH_OPT_DIR_CH%s":
    _strip_end: "_CH"

  # Group the per-channel registers the same way the other GDMA v2 chips do, so that esp-hal can
  # index them. Unlike on the C5/C61, the link address registers are part of the channel block on
  # this chip, so they end up in the cluster as well.
  _expand_array:
    IN_INT_ST_CH%s: {}
    IN_INT_ENA_CH%s: {}
    IN_INT_CLR_CH%s: {}

    OUT_INT_RAW_CH%s: {}
    OUT_INT_ST_CH%s: {}
    OUT_INT_ENA_CH%s: {}
    OUT_INT_CLR_CH%s: {}

    IN_CONF0_CH%s: {}
    IN_CONF1_CH%s: {}
    INFIFO_STATUS_CH%s: {}
    IN_POP_CH%s: {}
    IN_LINK_CH%s: {}
    IN_LINK_ADDR_CH%s: {}
    IN_STATE_CH%s: {}
    IN_SUC_EOF_DES_ADDR_CH%s: {}
    IN_ERR_EOF_DES_ADDR_CH%s: {}
    IN_DSCR_CH%s: {}
    IN_DSCR_BF0_CH%s: {}
    IN_DSCR_BF1_CH%s: {}
    IN_PRI_CH%s: {}
    IN_PERI_SEL_CH%s: {}

    OUT_CONF0_CH%s: {}
    OUT_CONF1_CH%s: {}
    OUTFIFO_STATUS_CH%s: {}
    OUT_PUSH_CH%s: {}
    OUT_LINK_CH%s: {}
    OUT_LINK_ADDR_CH%s: {}
    OUT_STATE_CH%s: {}
    OUT_EOF_DES_ADDR_CH%s: {}
    OUT_EOF_BFR_DES_ADDR_CH%s: {}
    OUT_DSCR_CH%s: {}
    OUT_DSCR_BF0_CH%s: {}
    OUT_DSCR_BF1_CH%s: {}
    OUT_PRI_CH%s: {}
    OUT_PERI_SEL_CH%s: {}
    RX_CH_ARB_WEIGH_CH%s: {}
    RX_ARB_WEIGH_OPT_DIR_CH%s: {}
    OUT_DONE_DES_ADDR_CH%s: {}
    TX_CH_ARB_WEIGH_CH%s: {}
    TX_ARB_WEIGH_OPT_DIR_CH%s: {}

  _cluster:
    IN_INT_CH%s:
      IN_INT_RAW_CH?:
        name: RAW
      IN_INT_ST_CH?:
        name: ST
      IN_INT_ENA_CH?:
        name: ENA
      IN_INT_CLR_CH?:
        name: CLR
        _modify:
          "*":
            modifiedWriteValues: oneToClear

    OUT_INT_CH%s:
      OUT_INT_RAW_CH?:
        name: RAW
      OUT_INT_ST_CH?:
        name: ST
      OUT_INT_ENA_CH?:
        name: ENA
      OUT_INT_CLR_CH?:
        name: CLR
        _modify:
          "*":
            modifiedWriteValues: oneToClear

    CH%s:
      IN_CONF0_CH?:
        name: IN_CONF0
      IN_CONF1_CH?:
        name: IN_CONF1
      INFIFO_STATUS_CH?:
        name: INFIFO_STATUS
      IN_POP_CH?:
        name: IN_POP
      IN_LINK_CH?:
        name: IN_LINK
      IN_LINK_ADDR_CH?:
        name: IN_LINK_ADDR
      IN_STATE_CH?:
        name: IN_STATE
      IN_SUC_EOF_DES_ADDR_CH?:
        name: IN_SUC_EOF_DES_ADDR
      IN_ERR_EOF_DES_ADDR_CH?:
        name: IN_ERR_EOF_DES_ADDR
      IN_DSCR_CH?:
        name: IN_DSCR
      IN_DSCR_BF0_CH?:
        name: IN_DSCR_BF0
      IN_DSCR_BF1_CH?:
        name: IN_DSCR_BF1
      IN_PRI_CH?:
        name: IN_PRI
      IN_PERI_SEL_CH?:
        name: IN_PERI_SEL
      OUT_CONF0_CH?:
        name: OUT_CONF0
      OUT_CONF1_CH?:
        name: OUT_CONF1
      OUTFIFO_STATUS_CH?:
        name: OUTFIFO_STATUS
      OUT_PUSH_CH?:
        name: OUT_PUSH
      OUT_LINK_CH?:
        name: OUT_LINK
      OUT_LINK_ADDR_CH?:
        name: OUT_LINK_ADDR
      OUT_STATE_CH?:
        name: OUT_STATE
      OUT_EOF_DES_ADDR_CH?:
        name: OUT_EOF_DES_ADDR
      OUT_EOF_BFR_DES_ADDR_CH?:
        name: OUT_EOF_BFR_DES_ADDR
      OUT_DSCR_CH?:
        name: OUT_DSCR
      OUT_DSCR_BF0_CH?:
        name: OUT_DSCR_BF0
      OUT_DSCR_BF1_CH?:
        name: OUT_DSCR_BF1
      OUT_PRI_CH?:
        name: OUT_PRI
      OUT_PERI_SEL_CH?:
        name: OUT_PERI_SEL
      IN_DONE_DES_ADDR_CH?:
        name: IN_DONE_DES_ADDR
      RX_CH_ARB_WEIGH_CH?:
        name: RX_CH_ARB_WEIGH
      RX_ARB_WEIGH_OPT_DIR_CH?:
        name: RX_ARB_WEIGH_OPT_DIR
      OUT_DONE_DES_ADDR_CH?:
        name: OUT_DONE_DES_ADDR
      TX_CH_ARB_WEIGH_CH?:
        name: TX_CH_ARB_WEIGH
      TX_ARB_WEIGH_OPT_DIR_CH?:
        name: TX_ARB_WEIGH_OPT_DIR
