LEDC:
  "*":
    _strip_end: "_CH"

  "TIMER%s_CONF":
    _strip: "TIMER_"

    _modify:
      TICK_SEL_TIMER:
        name: TICK_SEL
      CLK_DIV_TIMER:
        name: CLK_DIV

  _add:
    CH%s_FADE_PARAM:
      dim: 8
      dimIncrement: 0x40
      dimIndex: 0-7
      description: LEDC channel %s fade parameter register
      addressOffset: 0x400
      access: read-write
      size: 0x20
      resetValue: 0x0
      fields:
        DUTY_INC:
          description: Configures whether the duty cycle increases or decreases.
          bitOffset: 0
          bitWidth: 1
        DUTY_CYCLE:
          description: Configures the duty cycle fading clock cycles between each duty change.
          bitOffset: 1
          bitWidth: 10
        SCALE:
          description: Configures the step size scaled for each duty cycle fading step.
          bitOffset: 11
          bitWidth: 10
        DUTY_NUM:
          description: Configures the number of times the duty cycle will be changed.
          bitOffset: 21
          bitWidth: 10
